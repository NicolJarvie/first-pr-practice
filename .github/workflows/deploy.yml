# Uploads the website to Fasthosts whenever site files change on main.
#
# One-time setup (GitHub → repo Settings → Secrets and variables → Actions):
#   Secrets tab:   FTP_PASSWORD = the Fasthosts FTP password
#   Variables tab: DEPLOY_MODE  = coming-soon  (stage 1)  or  full  (stages 2-3)
#                  If DEPLOY_MODE isn't set, the coming-soon page is deployed.
#
# Can also be run by hand: Actions tab → "Deploy website" → Run workflow.
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "privacy.html"
      - "app-ads.txt"
      - "robots.txt"
      - "sitemap.xml"
      - "games/**"
      - "css/**"
      - "assets/**"
      - "coming-soon/**"
      - "scripts/deploy.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Never run two uploads at once.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upload to Fasthosts
        env:
          FTP_HOST: ftp.fasthosts.co.uk
          FTP_USER: thejaroflife.com
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: "21"
          FTP_REMOTE_DIR: ""   # the FTP login already lands in htdocs
          FTP_TLS: "true"
          DEPLOY_MODE: ${{ vars.DEPLOY_MODE }}
        run: |
          if [ "$DEPLOY_MODE" = "full" ]; then
            echo "Deploying the FULL site"
            python scripts/deploy.py
          else
            echo "Deploying the COMING-SOON page (set DEPLOY_MODE=full to switch)"
            python scripts/deploy.py --coming-soon
          fi
