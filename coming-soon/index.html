<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Jar of Life — Indie Mobile Games</title>
  <meta name="description" content="The Jar of Life is an independent mobile game studio. Our first game is in development — coming soon.">
  <link rel="canonical" href="https://thejaroflife.com/">
  <link rel="icon" href="assets/img/jar-of-life-favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/img/jar-of-life-favicon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/img/jar-of-life-icon.png">

  <meta property="og:title" content="The Jar of Life — Mobile Games">
  <meta property="og:description" content="Independent mobile game studio. First game coming soon.">
  <meta property="og:url" content="https://thejaroflife.com/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://thejaroflife.com/assets/img/og-jar-of-life.jpg">

  <!-- Pre-launch placeholder. Deployed with: python scripts/deploy.py --coming-soon
       The full site (python scripts/deploy.py) replaces this page at launch. -->
  <style>
    :root {
      --bg: #12101a;
      --text: #ece8f4;
      --muted: #a9a2bb;
      --accent: #f2b544;
      --accent-2: #7fd1b9;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 20% 15%, rgba(242, 181, 68, 0.14), transparent 45%),
        radial-gradient(circle at 80% 85%, rgba(127, 209, 185, 0.12), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 16px;
    }
    .logo {
      width: 100%;
      max-width: 340px;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .eyebrow {
      margin: 32px 0 8px;
      color: var(--accent-2);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 0.8rem;
      font-weight: 600;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      line-height: 1.15;
    }
    p { margin: 0 auto; max-width: 46ch; color: var(--muted); font-size: 1.05rem; }
    .platform {
      display: inline-block;
      margin: 0 0 16px;
      padding: 4px 14px;
      border: 1px solid rgba(127, 209, 185, 0.5);
      border-radius: 999px;
      color: var(--accent-2);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .contact { margin-top: 28px; }
    .contact a {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 999px;
      border: 2px solid var(--accent);
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    .contact a:hover { color: var(--accent-2); border-color: var(--accent-2); }
    footer a { color: var(--muted); }
    footer a:hover { color: var(--accent); }
    footer {
      padding: 24px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="assets/img/jar-of-life-logo.jpg" width="776" height="768"
         alt="The Jar of Life — Mobile Games logo: a golden jar overflowing with gems, coins and treasures">
    <p class="eyebrow">Independent mobile games</p>
    <h1>Something is brewing in the jar.</h1>
    <p class="platform">Coming to Android</p>
    <p>My first game is in development. Small, fair, free to play, and made with care. Check back soon.</p>
    <p class="contact"><a href="mailto:support@thejaroflife.com">support@thejaroflife.com</a></p>
  </main>
  <footer>&copy; <span id="year">2026</span> The Jar of Life · <a href="privacy.html">Privacy policy</a></footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
